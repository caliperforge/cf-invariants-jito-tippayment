[package]
name = "jito-tip-payment"
version = "0.1.10"
edition = "2021"
license = "Apache-2.0"
authors = ["Jito Network <team@jito.network>"]
homepage = "https://jito.network"
repository = "https://github.com/jito-foundation/jito-programs"
description = "Tip Payment Program"

[lib]
crate-type = ["cdylib", "lib"]
name = "jito_tip_payment"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
default = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]

# Pinned to cf-invariants-anchor's / cf-invariants-jito's CI-green stack:
# anchor-lang 1.0.1 (matches Crucible v0.2.0 workspace).
#
# We drop the upstream direct `solana-program = "2.2"` pin. anchor-lang 1.0.1
# supplies solana-program transitively via its modular solana-3.x interfaces.
# Upstream tip-payment's only use of solana-program was
# `use solana_program::loader_v4;` (one site inside `is_program`) — in the
# modular split that lives in `solana-sdk-ids = "3"`'s `loader_v4` module,
# which we depend on directly. solana-sdk-ids 3 also supplies the bpf_loader /
# native_loader / config / secp256r1_program / sysvar ID modules upstream uses
# from the same crate (upstream pinned solana-sdk-ids = "2.2"; we move to the
# transitive 3.1.0 that anchor-lang 1.0.1 pulls in to avoid a diamond pin).
[dependencies]
anchor-lang = "=1.0.1"
solana-sdk-ids = "3"
solana-security-txt = "1.1.1"
